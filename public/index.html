<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Book-Cycle 로그인</title>
</head>
<body>
<h1>📚 Book-Cycle 사용자 관리</h1>

<!-- ✅ 회원가입 -->
<h2>👤 회원가입</h2>
<input id="signup-name" placeholder="이름">
<input id="signup-id" placeholder="아이디">
<input id="signup-password" type="password" placeholder="비밀번호">
<button onclick="createUser()">회원가입</button>

<!-- ✅ 로그인 -->
<h2>🔐 로그인</h2>
<input id="login-id" placeholder="아이디">
<input id="login-password" type="password" placeholder="비밀번호">
<button onclick="loginUser()">로그인</button>

<script>
    const REGISTER_URL = 'http://localhost:3000/api/register';
    const LOGIN_URL = 'http://localhost:3000/api/login';

    async function createUser() {
        const name = document.getElementById('signup-name').value;
        const id = document.getElementById('signup-id').value;
        const password = document.getElementById('signup-password').value;

        const res = await fetch(REGISTER_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ name, id, password })
        });

        const result = await res.json();
        alert(result.message || '회원가입 완료');
    }

    async function loginUser() {
        const id = document.getElementById('login-id').value;
        const password = document.getElementById('login-password').value;

        const res = await fetch(LOGIN_URL, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ id, password })
        });

        if (!res.ok) {
            const error = await res.json();
            alert(error.message || '로그인 실패');
            return;
        }

        const data = await res.json();
        localStorage.setItem('token', data.token);  //토큰 저장
        alert('로그인 성공!');
        window.location.href = 'upload.html';  //업로드 페이지로 이동
    }
</script>
</body>
</html>
