<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>Book-Cycle 이미지 업로드 UI</title>
    <style>
        #uploadedImages {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        .image-wrapper {
            position: relative;
            display: inline-block;
        }
        .image-wrapper img {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border: 1px solid #ccc;
            display: block;
        }
        .delete-btn {
            position: absolute;
            top: 3px;
            right: 3px;
            background: rgba(255, 0, 0, 0.7);
            border: none;
            color: white;
            font-weight: bold;
            cursor: pointer;
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 14px;
        }
        .download-btn {
            position: absolute;
            bottom: 3px;
            right: 3px;
            background: rgba(0, 0, 0, 0.6);
            color: white;
            font-size: 14px;
            padding: 2px 6px;
            text-decoration: none;
            border-radius: 3px;
        }
        #resetBtn {
            margin-top: 10px;
            padding: 6px 12px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        #resetBtn:hover {
            background: #d32f2f;
        }
    </style>
</head>
<body>
<h1>📚 Book-Cycle 이미지 업로드</h1>

<h2>이미지 업로드</h2>
<label>이미지 선택 (최대 5개):
    <input type="file" id="fileInput" accept="image/*" multiple />
</label>
<button onclick="uploadImages()">업로드</button>
<button id="resetBtn" onclick="resetImages()">리셋</button>

<h2>📸 업로드된 이미지</h2>
<div id="uploadedImages"></div>

<script>
    const API_UPLOAD = 'https://book-cycle-backend.onrender.com/api/upload';
    const API_DELETE = 'https://book-cycle-backend.onrender.com/api/upload';
    const MAX_FILES = 5;
    const STORAGE_KEY = 'uploadedImageUrls';

    function loadStoredImages() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
    }

    function saveStoredImages(urls) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(urls));
    }

    function addImageToDOM(url) {
        const container = document.getElementById('uploadedImages');
        const wrapper = document.createElement('div');
        wrapper.className = 'image-wrapper';

        const img = document.createElement('img');
        img.src = url;
        wrapper.appendChild(img);

        const downloadBtn = document.createElement('a');
        downloadBtn.href = url;
        downloadBtn.download = '';
        downloadBtn.className = 'download-btn';
        downloadBtn.textContent = '⬇️';
        wrapper.appendChild(downloadBtn);

        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = 'X';
        deleteBtn.className = 'delete-btn';
        deleteBtn.onclick = () => deleteImage(url, wrapper);
        wrapper.appendChild(deleteBtn);

        container.appendChild(wrapper);
    }

    function showStoredImages() {
        const urls = loadStoredImages();
        const container = document.getElementById('uploadedImages');
        container.innerHTML = '';
        urls.forEach(url => addImageToDOM(url));
    }

    function showUploadedImages(urls) {
        const storedUrls = loadStoredImages();
        const newUrls = [...storedUrls, ...urls];
        saveStoredImages(newUrls);
        urls.forEach(url => addImageToDOM(url));
    }

    async function deleteImage(url, wrapperElem) {
        if (!confirm('이 이미지를 삭제하시겠습니까?')) return;

        try {
            const res = await fetch(API_DELETE, {
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ imageUrl: url })
            });

            if (!res.ok) {
                const errorData = await res.json();
                alert(errorData.error || '삭제 실패');
                return;
            }

            wrapperElem.remove();
            let urls = loadStoredImages();
            urls = urls.filter(u => u !== url);
            saveStoredImages(urls);
            alert('이미지가 삭제되었습니다.');
        } catch (e) {
            alert('삭제 중 오류가 발생했습니다.');
            console.error(e);
        }
    }

    async function uploadImages() {
        const input = document.getElementById('fileInput');

        if (!input.files.length) {
            alert('파일을 선택해주세요.');
            return;
        }

        if (input.files.length > MAX_FILES) {
            alert(`최대 ${MAX_FILES}개까지만 업로드할 수 있습니다.`);
            return;
        }

        const formData = new FormData();
        for (const file of input.files) {
            formData.append('images', file);
        }

        try {
            const res = await fetch(API_UPLOAD, {
                method: 'POST',
                body: formData
            });

            if (!res.ok) {
                const errorData = await res.json();
                alert(errorData.error || '업로드 실패');
                return;
            }

            const data = await res.json();
            alert(data.message);
            showUploadedImages(data.imageUrls);
            input.value = ''; // 초기화
        } catch (e) {
            alert('업로드 중 오류가 발생했습니다.');
            console.error(e);
        }
    }

    function resetImages() {
        if (!confirm('업로드된 모든 이미지를 삭제하고 리셋하시겠습니까?')) return;

        localStorage.removeItem(STORAGE_KEY);
        const container = document.getElementById('uploadedImages');
        container.innerHTML = '';
        alert('모든 이미지가 리셋되었습니다.');
    }

    window.onload = () => {
        showStoredImages();
    };
</script>
</body>
</html>
